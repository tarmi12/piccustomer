<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Final - สแกนรับเงิน</title>
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="shared/config.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; padding: 12px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
    .scanner-box { position: relative; width: 100%; max-width: 420px; height: 240px; margin: auto; overflow: hidden; border-radius: 8px; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .laser-guide { position: absolute; top: 50%; left: 10%; width: 80%; height: 2px; background: red; box-shadow: 0 0 6px red; }
    .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin-top: 8px; }
    .btn-green { background: #2e7d32; color: #fff; }
    .btn-blue { background: #1976d2; color: #fff; }
    .btn-orange { background: #f57c00; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #999; color: #333; }
    input[type="text"] { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; text-align: center; margin-top: 6px; }
    .preview-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .thumb-box { position: relative; width: 80px; height: 80px; }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
    .thumb-box button { position: absolute; top: 0; right: 0; background: red; color: #fff; border: none; border-radius: 0 0 0 6px; width: 20px; height: 20px; }
    .station-block { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-top: 8px; }
    .station-block h5 { margin-bottom: 6px; color: #333; }
    .status-log { font-size: 13px; color: #d32f2f; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="color: #2e7d32;">แคชเชียร์รับเงิน (Final)</h3>
      <span id="billBadge" style="background: #e0e0e0; padding: 4px 8px; border-radius: 12px; font-size: 13px;">รอสแกน</span>
    </div>

    <!-- ขั้นที่ 1: สแกนบาร์โค้ดบิล -->
    <div id="stepScan">
      <p style="text-align: center; font-size: 14px; color: #555; margin-bottom: 8px;">สแกนบาร์โค้ดเพื่อค้นหาบิล</p>
      <div class="scanner-box">
        <video id="scanVideo" playsinline></video>
        <div class="laser-guide"></div>
      </div>
      <div style="margin-top: 14px; text-align: center;">
        <input type="text" id="manualBillInput" placeholder="หรือกรอกเลขบิลที่นี่">
        <button class="btn btn-blue" onclick="useManualBill()">ค้นหาบิล</button>
      </div>
    </div>

    <!-- ขั้นที่ 2: แสดงรูปทุกสถานี + ถ่ายรูปรับเงิน -->
    <div id="stepConfirm" style="display: none;">
      <h4 id="billTitle" style="color: #2e7d32; margin-bottom: 8px;"></h4>

      <!-- รูปเปรียบเทียบจากแต่ละสถานี -->
      <div class="station-block"><h5>รูปจาก Station 1:</h5><div id="st1Imgs" class="preview-grid">ไม่มีรูป</div></div>
      <div class="station-block"><h5>รูปจาก Station 2:</h5><div id="st2Imgs" class="preview-grid">ไม่มีรูป</div></div>
      <div class="station-block"><h5>รูปจาก Station 3:</h5><div id="st3Imgs" class="preview-grid">ไม่มีรูป</div></div>

      <!-- ถ่ายรูปตอนรับเงิน/บัตรประชาชน -->
      <div style="margin-top: 16px; border-top: 2px dashed #ccc; padding-top: 12px;">
        <h4>📸 ถ่ายรูปลูกค้ารับเงิน / บัตรประชาชน (สูงสุด 3 รูป):</h4>
        <div class="scanner-box" style="height: 240px; margin-top: 8px;">
          <video id="finalVideo" autoplay playsinline></video>
        </div>
        <button class="btn btn-orange" onclick="takeFinalPhoto()">ถ่ายรูปรับเงิน/บัตร</button>
        <div id="finalPhotosList" class="preview-grid"></div>
      </div>

      <div style="margin-top: 16px;">
        <button id="btnPay" class="btn btn-green" onclick="confirmPayment()">✅ ยืนยันรับเงิน (บันทึกลง Google Drive)</button>
        <button class="btn btn-outline" onclick="resetScan()">สแกนบิลอื่น</button>
      </div>
      <p id="finalLog" class="status-log"></p>
    </div>
  </div>

  <script>
    const FINAL_LIFF_ID = "2011506265-LZD82myR";
    let db = null;
    let codeReader = null;
    let currentBillData = null;
    let finalImages = [];
    let finalStream = null;

    function dataURLtoBlob(dataurl) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], { type: mime });
    }

    window.onload = async () => {
      try {
        db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        alert("ตั้งค่า SUPABASE_URL ไม่ถูกต้อง กรุณาตรวจสอบ config.js");
        return;
      }

      try {
        if (typeof liff !== "undefined") {
          await liff.init({ liffId: FINAL_LIFF_ID });
        }
      } catch (e) {
        console.warn("LIFF Init failed, fallback to web:", e);
      }

      startScanner();
    };

    function startScanner() {
      codeReader = new ZXing.BrowserMultiFormatReader();
      codeReader.decodeFromVideoDevice(null, 'scanVideo', (result, err) => {
        if (result && result.text) {
          fetchBill(result.text);
        }
      });
    }

    function useManualBill() {
      const val = document.getElementById("manualBillInput").value.trim();
      if (!val) { alert("กรุณากรอกเลขบิล"); return; }
      fetchBill(val);
    }

    async function fetchBill(billNo) {
      if (codeReader) {
        codeReader.reset();
        codeReader = null;
      }

      const { data, error } = await db.from("customers").select("*").eq("bill_number", billNo).maybeSingle();
      if (error || !data) {
        alert("ไม่พบข้อมูลของบิล: " + billNo);
        startScanner();
        return;
      }

      currentBillData = data;
      document.getElementById("stepScan").style.display = "none";
      document.getElementById("stepConfirm").style.display = "block";
      document.getElementById("billBadge").innerText = billNo;
      document.getElementById("billTitle").innerText = `บิลเลขที่: ${billNo}`;

      renderThumbs("st1Imgs", data.station1_thumbs);
      renderThumbs("st2Imgs", data.station2_thumbs);
      renderThumbs("st3Imgs", data.station3_thumbs);

      startFinalCamera();
    }

    function renderThumbs(boxId, urls) {
      const box = document.getElementById(boxId);
      box.innerHTML = "";
      if (!urls || urls.length === 0) { box.innerText = "ไม่มีรูป"; return; }
      urls.forEach(u => {
        const div = document.createElement("div");
        div.className = "thumb-box";
        div.innerHTML = `<img src="${u}">`;
        box.appendChild(div);
      });
    }

    async function startFinalCamera() {
      const video = document.getElementById("finalVideo");
      try {
        finalStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = finalStream;
      } catch (e) {
        console.error("Camera error", e);
      }
    }

    function takeFinalPhoto() {
      if (finalImages.length >= 3) {
        alert("ถ่ายได้สูงสุด 3 รูปครับ");
        return;
      }
      const video = document.getElementById("finalVideo");
      const canvas = document.createElement("canvas");
      const targetWidth = 640;
      const scale = targetWidth / video.videoWidth;
      canvas.width = targetWidth;
      canvas.height = video.videoHeight * scale;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      finalImages.push(canvas.toDataURL("image/jpeg", 0.7));
      renderFinalThumbs();
    }

    function removeFinalPhoto(idx) {
      finalImages.splice(idx, 1);
      renderFinalThumbs();
    }

    function renderFinalThumbs() {
      const box = document.getElementById("finalPhotosList");
      box.innerHTML = "";
      finalImages.forEach((url, idx) => {
        const div = document.createElement("div");
        div.className = "thumb-box";
        div.innerHTML = `<img src="${url}"><button onclick="removeFinalPhoto(${idx})">X</button>`;
        box.appendChild(div);
      });
    }

    // แปลงภาพ Public URL จาก Supabase กลับเป็น Base64 ส่งให้ Google Apps Script
    async function urlToBase64(url) {
      const res = await fetch(url);
      const blob = await res.blob();
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    async function confirmPayment() {
      const btn = document.getElementById("btnPay");
      const log = document.getElementById("finalLog");
      log.innerText = "";
      btn.disabled = true;
      btn.innerText = "กำลังบันทึกรูป Final...";

      try {
        // 1. อัปโหลดรูป Final ขึ้น Supabase Storage
        const finalUrls = [];
        for (let i = 0; i < finalImages.length; i++) {
          const blob = dataURLtoBlob(finalImages[i]);
          const filePath = `${currentBillData.bill_number}/final/${Date.now()}_${i+1}.jpg`;
          const { error: upErr } = await db.storage
            .from(STORAGE_BUCKET)
            .upload(filePath, blob, { contentType: 'image/jpeg', upsert: true });

          if (upErr) throw new Error("Storage Upload Final Error: " + upErr.message);

          const { data: pData } = db.storage.from(STORAGE_BUCKET).getPublicUrl(filePath);
          finalUrls.push(pData.publicUrl);
        }

        btn.innerText = "กำลังส่งรูปเข้า Google Drive...";

        // 2. รวบรวมรูปทั้งหมด (St.1, St.2, St.3 + Final) ส่งเข้า Google Drive
        const allUrls = [
          ...(currentBillData.station1_thumbs || []),
          ...(currentBillData.station2_thumbs || []),
          ...(currentBillData.station3_thumbs || []),
          ...finalUrls
        ];

        const payloadImgs = [];
        for (let i = 0; i < allUrls.length; i++) {
          const b64 = await urlToBase64(allUrls[i]);
          payloadImgs.push({ name: `img_${i+1}.jpg`, base64: b64 });
        }

        if (payloadImgs.length > 0 && GOOGLE_SCRIPT_URL) {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors", // จำเป็นสำหรับ Apps Script Web App
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "saveBillImages",
              billNumber: currentBillData.bill_number,
              images: payloadImgs
            })
          });
        }

        // 3. ปรับสถานะเป็น PAID ใน Supabase
        btn.innerText = "กำลังปิดบิล...";
        const { error: dbErr } = await db.from("customers").update({
          final_status: "PAID",
          final_thumbs: finalUrls,
          final_time: new Date().toISOString()
        }).eq("bill_number", currentBillData.bill_number);

        if (dbErr) throw new Error("DB Update Error: " + dbErr.message);

        alert("✅ ยืนยันรับเงินและสำรองรูปเข้า Google Drive สำเร็จ!");
        resetScan();
      } catch (err) {
        console.error(err);
        log.innerText = err.message;
        alert("เกิดข้อผิดพลาด: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "✅ ยืนยันรับเงิน (บันทึกลง Google Drive)";
      }
    }

    function resetScan() {
      if (finalStream) {
        finalStream.getTracks().forEach(t => t.stop());
        finalStream = null;
      }
      finalImages = [];
      currentBillData = null;
      document.getElementById("stepConfirm").style.display = "none";
      document.getElementById("stepScan").style.display = "block";
      document.getElementById("billBadge").innerText = "รอสแกน";
      document.getElementById("manualBillInput").value = "";
      document.getElementById("finalLog").innerText = "";
      startScanner();
    }
  </script>
</body>
</html>
