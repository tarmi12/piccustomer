<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station ถ่ายภาพ</title>
  <link rel="stylesheet" href="shared/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared/config.js"></script>
  <script src="shared/api.js"></script>
  <script src="shared/camera.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; max-width: 800px; margin: auto; }
    .station-header { background: #2e7d32; color: #fff; padding: 12px; border-radius: 8px; text-align: center; }
    .camera-container { margin: 16px 0; text-align: center; }
    video { width: 100%; max-width: 480px; height: auto; border-radius: 8px; background: #000; }
    .preview-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .thumb-wrap { position: relative; width: 100px; height: 100px; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
    .thumb-wrap button { position: absolute; top: 0; right: 0; background: red; color: #fff; border: none; cursor: pointer; }
    .compare-box { margin-top: 20px; padding: 12px; border: 1px dashed #4caf50; border-radius: 8px; background: #f9fff9; }
    .btn-large { padding: 12px 24px; font-size: 16px; border-radius: 6px; border: none; cursor: pointer; }
    .btn-green { background: #2e7d32; color: #fff; }
    .btn-blue { background: #1976d2; color: #fff; }
  </style>
</head>
<body>

  <div class="station-header">
    <h2 id="stationTitle">สถานีถ่ายภาพ</h2>
  </div>

  <div style="margin-top: 16px;">
    <label><strong>สแกน / กรอกเลขบิล:</strong></label><br>
    <input type="text" id="billInput" placeholder="กรอกเลขบิล..." style="width: 70%; padding: 10px; font-size: 18px;" onkeypress="if(event.key==='Enter') searchBill()">
    <button class="btn-large btn-blue" onclick="searchBill()">ค้นหาบิล</button>
  </div>

  <!-- โซนเทียบรูปเดิมจากสถานีอื่น -->
  <div id="compareArea" class="compare-box" style="display:none;">
    <h4>รูปที่เคยถ่ายจากสถานีอื่น (สำหรับเทียบหน้า):</h4>
    <div id="compareImages" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
  </div>

  <!-- โซนกล้อง -->
  <div class="camera-container">
    <label>เลือกกล้อง: </label>
    <select id="cameraSelect" onchange="switchCamera()" style="padding: 6px;"></select>
    <br><br>
    <video id="videoElement" autoplay playsinline></video>
    <br>
    <button class="btn-large btn-blue" onclick="takeSnapshot()">📸 ถ่ายรูป</button>
  </div>

  <!-- รูปที่เพิ่งถ่าย -->
  <div>
    <h4>รูปที่ถ่ายรอบนี้:</h4>
    <div id="capturedList" class="preview-list"></div>
  </div>

  <div style="margin-top: 20px;">
    <button id="btnSave" class="btn-large btn-green" style="width: 100%;" onclick="saveData()">บันทึกข้อมูลสถานี</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const stationId = urlParams.get('station') || '1';
    document.getElementById("stationTitle").innerText = `สถานีถ่ายภาพที่ ${stationId}`;

    let capturedImages = []; // เก็บ Data URL รูปย่อ

    // เริ่มต้นกล้อง
    window.addEventListener("DOMContentLoaded", async () => {
      await CameraModule.init('cameraSelect', 'videoElement');
    });

    function switchCamera() {
      const deviceId = document.getElementById("cameraSelect").value;
      CameraModule.startCamera(deviceId);
    }

    // ถ่ายภาพพร้อมย่อขนาดให้พอดี (กว้าง 640px) ไม่ให้หนักระบบ
    function takeSnapshot() {
      const video = document.getElementById("videoElement");
      const canvas = document.createElement("canvas");
      const targetWidth = 640;
      const scale = targetWidth / video.videoWidth;
      canvas.width = targetWidth;
      canvas.height = video.videoHeight * scale;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const smallDataUrl = canvas.toDataURL("image/jpeg", 0.7); // ย่อขนาดและบีบอัด 70%
      capturedImages.push(smallDataUrl);
      renderCapturedThumbs();
    }

    function removeSnapshot(idx) {
      capturedImages.splice(idx, 1);
      renderCapturedThumbs();
    }

    function renderCapturedThumbs() {
      const list = document.getElementById("capturedList");
      list.innerHTML = "";
      capturedImages.forEach((dataUrl, idx) => {
        const div = document.createElement("div");
        div.className = "thumb-wrap";
        div.innerHTML = `
          <img src="${dataUrl}">
          <button onclick="removeSnapshot(${idx})">X</button>
        `;
        list.appendChild(div);
      });
    }

    // สแกนเลขบิลเพื่อดึงรูปจากสถานีอื่นมาเทียบหน้า
    async function searchBill() {
      const billNo = document.getElementById("billInput").value.trim();
      if (!billNo) return;

      const cust = await Api.getCustomer(billNo);
      const compareBox = document.getElementById("compareArea");
      const compareImages = document.getElementById("compareImages");
      compareImages.innerHTML = "";

      if (cust) {
        let otherThumbs = [];
        for (let i = 1; i <= 3; i++) {
          if (i.toString() !== stationId && cust[`station${i}_thumbs`]) {
            otherThumbs = otherThumbs.concat(cust[`station${i}_thumbs`]);
          }
        }

        if (otherThumbs.length > 0) {
          otherThumbs.forEach(url => {
            const img = document.createElement("img");
            img.src = url;
            img.style.width = "100px";
            img.style.height = "100px";
            img.style.objectFit = "cover";
            img.style.borderRadius = "6px";
            compareImages.appendChild(img);
          });
          compareBox.style.display = "block";
        } else {
          compareBox.style.display = "none";
        }
      } else {
        compareBox.style.display = "none";
      }
    }

    // บันทึกรูปย่อเข้า Supabase
    async function saveData() {
      const billNo = document.getElementById("billInput").value.trim();
      if (!billNo) { alert("กรุณาระบุเลขบิล"); return; }
      if (capturedImages.length === 0) { alert("กรุณาถ่ายรูปอย่างน้อย 1 รูป"); return; }

      const btn = document.getElementById("btnSave");
      btn.innerText = "กำลังบันทึก...";
      btn.disabled = true;

      try {
        const uploadedUrls = [];
        for (let i = 0; i < capturedImages.length; i++) {
          const url = await Api.uploadImage(billNo, stationId, capturedImages[i], i);
          uploadedUrls.push(url);
        }

        await Api.saveStation(billNo, stationId, uploadedUrls);
        alert("บันทึกสำเร็จ!");
        
        // เคลียร์หน้าจอพร้อมบิลถัดไป
        capturedImages = [];
        renderCapturedThumbs();
        document.getElementById("billInput").value = "";
        document.getElementById("compareArea").style.display = "none";
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
      } finally {
        btn.innerText = "บันทึกข้อมูลสถานี";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
