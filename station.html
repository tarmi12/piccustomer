<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สถานีถ่ายภาพยืนยันตัวตน</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<div class="wrap">
  <span class="station-tag" id="stationTag">สถานี</span>
  <h1>ถ่ายภาพยืนยันตัวตน</h1>

  <label for="billInput">เลขที่บิล (สแกนบาร์โค้ดหรือพิมพ์)</label>
  <input type="text" id="billInput" autofocus placeholder="สแกนบาร์โค้ด...">

  <div id="lookupStatus"></div>

  <div id="historyBox" style="display:none;">
    <div class="section">
      <label>รูปจากสถานีอื่น (เทียบดูว่าเป็นคนเดียวกัน)</label>
      <div id="historyRows"></div>
    </div>
  </div>

  <div class="section">
    <label for="cameraSelect">เลือกกล้อง</label>
    <select id="cameraSelect"></select>
    <video id="video" autoplay playsinline muted></video>
    <button class="btn-primary" id="captureBtn" disabled>ถ่ายภาพ</button>
  </div>

  <div class="section">
    <label>รูปที่จะบันทึก (<span id="photoCount">0</span> รูป)</label>
    <div class="gallery" id="gallery"></div>
    <button class="btn-primary" id="submitBtn" disabled>ยืนยันบันทึกรูป</button>
  </div>

  <div id="submitStatus"></div>
</div>

<script src="shared/config.js"></script>
<script src="shared/api.js"></script>
<script src="shared/camera.js"></script>
<script>
const params = new URLSearchParams(location.search);
const STATION = params.get('station') === '2' ? 'station2'
  : params.get('station') === '3' ? 'station3'
  : 'station1';
document.getElementById('stationTag').textContent =
  { station1: 'Station 1', station2: 'Station 2', station3: 'Station 3' }[STATION];

const videoEl = document.getElementById('video');
const cameraSelect = document.getElementById('cameraSelect');
const captureBtn = document.getElementById('captureBtn');
const submitBtn = document.getElementById('submitBtn');
const billInput = document.getElementById('billInput');
const lookupStatus = document.getElementById('lookupStatus');
const historyBox = document.getElementById('historyBox');
const historyRows = document.getElementById('historyRows');
const gallery = document.getElementById('gallery');
const photoCount = document.getElementById('photoCount');
const submitStatus = document.getElementById('submitStatus');

let pendingPhotos = []; // { previewUrl, mimeType, original, thumbnail }
let currentBill = null;

// ---------- กล้อง ----------
async function initCameras() {
  try {
    const cams = await CameraModule.listCameras();
    if (cams.length === 0) {
      lookupStatus.innerHTML = statusHtml('error', 'ไม่พบกล้อง USB ที่เครื่องนี้');
      return;
    }
    cameraSelect.innerHTML = cams.map((c, i) =>
      `<option value="${c.deviceId}">${c.label || 'กล้อง ' + (i + 1)}</option>`).join('');

    const savedId = localStorage.getItem('selectedCameraId_' + STATION);
    if (savedId && cams.some(c => c.deviceId === savedId)) {
      cameraSelect.value = savedId;
    }
    await CameraModule.start(cameraSelect.value, videoEl, 'selectedCameraId_' + STATION);
    captureBtn.disabled = false;
  } catch (err) {
    lookupStatus.innerHTML = statusHtml('error', err.message);
  }
}

cameraSelect.addEventListener('change', async () => {
  await CameraModule.start(cameraSelect.value, videoEl, 'selectedCameraId_' + STATION);
});

captureBtn.addEventListener('click', () => {
  const photo = CameraModule.capture(videoEl);
  pendingPhotos.push(photo);
  renderGallery();
});

function renderGallery() {
  gallery.innerHTML = pendingPhotos.map((p, i) => `
    <figure>
      <img src="${p.previewUrl}" alt="รูปที่ ${i + 1}">
      <button data-i="${i}" title="ลบรูปนี้">×</button>
    </figure>
  `).join('');
  photoCount.textContent = pendingPhotos.length;
  submitBtn.disabled = pendingPhotos.length === 0 || !currentBill;
  gallery.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingPhotos.splice(Number(btn.dataset.i), 1);
      renderGallery();
    });
  });
}

// ---------- ค้นหาบิล ----------
billInput.addEventListener('change', async () => {
  const bill = billInput.value.trim();
  if (!bill) return;
  currentBill = bill;
  lookupStatus.innerHTML = statusHtml('info', 'กำลังค้นหา...');
  try {
    const res = await callGas('getCustomer', { billNumber: bill });
    if (!res.found) {
      lookupStatus.innerHTML = statusHtml('info', 'ไม่พบข้อมูลเดิม — เป็นบิลใหม่');
      historyBox.style.display = 'none';
    } else {
      lookupStatus.innerHTML = statusHtml('ok', 'พบข้อมูลลูกค้า: ' + (res.customerName || '-'));
      renderHistory(res.stations);
      historyBox.style.display = 'block';
    }
  } catch (err) {
    lookupStatus.innerHTML = statusHtml('error', err.message);
  }
  renderGallery();
});

function renderHistory(stations) {
  const labels = { station1: 'Station 1', station2: 'Station 2', station3: 'Station 3' };
  historyRows.innerHTML = Object.keys(labels).map(key => {
    const st = stations[key];
    const thumbs = (st && st.thumbs) || [];
    return `<div class="history-row">
      <div class="label">${labels[key]}</div>
      <div class="thumbs">
        ${thumbs.length
          ? thumbs.map(u => `<a href="${u}" target="_blank" rel="noopener"><img src="${u}"></a>`).join('')
          : '<span class="empty">ยังไม่ถ่าย</span>'}
      </div>
    </div>`;
  }).join('');
}

// ---------- บันทึก ----------
submitBtn.addEventListener('click', async () => {
  if (!currentBill || pendingPhotos.length === 0) return;
  submitBtn.disabled = true;
  submitStatus.innerHTML = statusHtml('info', 'กำลังบันทึก...');
  try {
    const res = await callGas('saveStation', {
      billNumber: currentBill,
      station: STATION,
      photos: pendingPhotos.map(p => ({
        mimeType: p.mimeType, original: p.original, thumbnail: p.thumbnail,
      })),
    });
    submitStatus.innerHTML = statusHtml('ok', 'บันทึกสำเร็จ ' + res.thumbs.length + ' รูป');
    // รีเซ็ตสำหรับลูกค้าถัดไป
    pendingPhotos = [];
    currentBill = null;
    billInput.value = '';
    historyBox.style.display = 'none';
    lookupStatus.innerHTML = '';
    renderGallery();
    billInput.focus();
  } catch (err) {
    submitStatus.innerHTML = statusHtml('error', err.message);
    submitBtn.disabled = false;
  }
});

function statusHtml(type, msg) {
  return `<div class="status ${type}">${msg}</div>`;
}

initCameras();
</script>
</body>
</html>
