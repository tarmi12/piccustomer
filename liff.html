<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Station - สแกนและถ่ายรูป</title>
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="shared/config.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; padding: 12px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .badge { background: #2e7d32; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 14px; font-weight: bold; }
    
    .scanner-box { position: relative; width: 100%; max-width: 420px; height: 260px; margin: auto; overflow: hidden; border-radius: 8px; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .laser-guide { position: absolute; top: 50%; left: 10%; width: 80%; height: 2px; background: red; box-shadow: 0 0 6px red; }
    
    .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin-top: 8px; }
    .btn-green { background: #2e7d32; color: #fff; }
    .btn-blue { background: #1976d2; color: #fff; }
    .btn-orange { background: #f57c00; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #999; color: #333; }
    
    input[type="text"] { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; text-align: center; margin-top: 6px; }
    .preview-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .thumb-box { position: relative; width: 80px; height: 80px; }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
    .thumb-box button { position: absolute; top: 0; right: 0; background: red; color: #fff; border: none; border-radius: 0 0 0 6px; width: 22px; height: 22px; }
    .status-log { font-size: 13px; color: #d32f2f; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-bar">
      <h3 id="stationLabel">กำลังเริ่มระบบ...</h3>
      <span class="badge" id="billBadge">รอสแกน</span>
    </div>

    <!-- โหมดที่ 1: สแกนบาร์โค้ด -->
    <div id="stepBarcode">
      <p style="text-align: center; font-size: 14px; color: #555; margin-bottom: 8px;">เล็งเส้นสีแดงให้อยู่บนบาร์โค้ด</p>
      <div class="scanner-box">
        <video id="barcodeVideo" playsinline></video>
        <div class="laser-guide"></div>
      </div>

      <div style="margin-top: 14px; text-align: center;">
        <span style="font-size: 13px; color: #777;">หากอ่านไม่ติด กรอกเลขบิลที่นี่:</span>
        <input type="text" id="manualBillInput" placeholder="เช่น 69011-1788852961">
        <button class="btn btn-blue" onclick="useManualBill()">ตกลงใช้เลขนี้</button>
      </div>
    </div>

    <!-- โหมดที่ 2: ถ่ายรูปลูกค้า -->
    <div id="stepCustomer" style="display: none;">
      <p style="text-align: center; font-size: 15px; color: #2e7d32; font-weight: bold; margin-bottom: 6px;" id="billTitleText"></p>
      
      <div class="scanner-box" style="height: 300px;">
        <video id="customerVideo" autoplay playsinline></video>
      </div>
      
      <button class="btn btn-orange" onclick="takeCustomerPhoto()">📸 กดถ่ายรูปลูกค้า</button>
      
      <div id="photoPreviewList" class="preview-grid"></div>

      <div style="margin-top: 14px;">
        <button id="btnSave" class="btn btn-green" onclick="saveCustomerData()">💾 บันทึกรูปและจบงาน</button>
        <button class="btn btn-outline" onclick="resetToBarcodeStep()">ยกเลิก / สแกนบิลใหม่</button>
      </div>
      <p id="errorLog" class="status-log"></p>
    </div>
  </div>

  <script>
    const MY_LIFF_ID = "2011506265-xs6XZnCO";
    let db = null;
    let codeReader = null;
    let currentStation = "1";
    let currentBillNumber = "";
    let customerImages = [];
    let customerStream = null;

    // แปลง Base64 DataURL เป็น Blob โดยตรง เพื่อความเสถียรบนมือถือ
    function dataURLtoBlob(dataurl) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], { type: mime });
    }

    window.onload = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentStation = urlParams.get('station') || '1';
      document.getElementById("stationLabel").innerText = `สถานีที่ ${currentStation}`;

      try {
        db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        alert("ตั้งค่า SUPABASE_URL ไม่ถูกต้อง กรุณาตรวจสอบ config.js");
        return;
      }

      try {
        if (typeof liff !== "undefined") {
          await liff.init({ liffId: MY_LIFF_ID });
        }
      } catch (e) {
        console.warn("LIFF Init failed, fallback to web:", e);
      }
      
      startBarcodeScanner();
    };

    function startBarcodeScanner() {
      codeReader = new ZXing.BrowserMultiFormatReader();
      codeReader.decodeFromVideoDevice(null, 'barcodeVideo', (result, err) => {
        if (result && result.text) {
          onBillDetected(result.text);
        }
      });
    }

    function useManualBill() {
      const val = document.getElementById("manualBillInput").value.trim();
      if (!val) { alert("กรุณาพิมพ์เลขบิลก่อน"); return; }
      onBillDetected(val);
    }

    function onBillDetected(billNo) {
      currentBillNumber = billNo;
      
      if (codeReader) {
        codeReader.reset();
        codeReader = null;
      }

      document.getElementById("stepBarcode").style.display = "none";
      document.getElementById("stepCustomer").style.display = "block";
      document.getElementById("billBadge").innerText = "บิล: " + billNo;
      document.getElementById("billTitleText").innerText = `กำลังบันทึกบิล: ${billNo}`;

      startCustomerCamera();
    }

    async function startCustomerCamera() {
      const video = document.getElementById("customerVideo");
      try {
        customerStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = customerStream;
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตสิทธิ์เข้าถึงกล้อง");
      }
    }

    function stopCustomerCamera() {
      if (customerStream) {
        customerStream.getTracks().forEach(t => t.stop());
        customerStream = null;
      }
    }

    function takeCustomerPhoto() {
      const video = document.getElementById("customerVideo");
      if (!video.videoWidth) {
        alert("กล้องยังไม่พร้อม กรุณารอสักครู่");
        return;
      }
      const canvas = document.createElement("canvas");
      const targetWidth = 640;
      const scale = targetWidth / video.videoWidth;
      canvas.width = targetWidth;
      canvas.height = video.videoHeight * scale;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      customerImages.push(canvas.toDataURL("image/jpeg", 0.7));
      renderPreview();
    }

    function removePhoto(idx) {
      customerImages.splice(idx, 1);
      renderPreview();
    }

    function renderPreview() {
      const box = document.getElementById("photoPreviewList");
      box.innerHTML = "";
      customerImages.forEach((url, idx) => {
        const div = document.createElement("div");
        div.className = "thumb-box";
        div.innerHTML = `<img src="${url}"><button onclick="removePhoto(${idx})">X</button>`;
        box.appendChild(div);
      });
    }

    async function saveCustomerData() {
      if (customerImages.length === 0) {
        alert("กรุณาถ่ายรูปอย่างน้อย 1 รูป");
        return;
      }

      const btn = document.getElementById("btnSave");
      const errEl = document.getElementById("errorLog");
      errEl.innerText = "";
      btn.innerText = "กำลังอัปโหลดรูป...";
      btn.disabled = true;

      try {
        const uploadedUrls = [];
        for (let i = 0; i < customerImages.length; i++) {
          const blob = dataURLtoBlob(customerImages[i]);
          const filePath = `${currentBillNumber}/station${currentStation}/${Date.now()}_${i+1}.jpg`;
          
          const { error: upErr } = await db.storage
            .from(STORAGE_BUCKET)
            .upload(filePath, blob, { contentType: 'image/jpeg', upsert: true });

          if (upErr) throw new Error("Storage Upload Error: " + upErr.message);

          const { data: pData } = db.storage.from(STORAGE_BUCKET).getPublicUrl(filePath);
          uploadedUrls.push(pData.publicUrl);
        }

        btn.innerText = "กำลังบันทึกฐานข้อมูล...";

        // ดึงข้อมูลเดิมมาอัปเดต ถ้าไม่มีให้แทรกใหม่
        const { data: existing, error: checkErr } = await db
          .from("customers")
          .select("bill_number")
          .eq("bill_number", currentBillNumber)
          .maybeSingle();

        if (checkErr) throw new Error("DB Check Error: " + checkErr.message);

        const payload = {
          bill_number: currentBillNumber,
          [`station${currentStation}_status`]: "DONE",
          [`station${currentStation}_thumbs`]: uploadedUrls,
          [`station${currentStation}_time`]: new Date().toISOString()
        };

        if (!existing) {
          const { error: inErr } = await db.from("customers").insert([payload]);
          if (inErr) throw new Error("DB Insert Error: " + inErr.message);
        } else {
          const { error: upDbErr } = await db.from("customers").update(payload).eq("bill_number", currentBillNumber);
          if (upDbErr) throw new Error("DB Update Error: " + upDbErr.message);
        }

        alert("✅ บันทึกข้อมูลบิล " + currentBillNumber + " สำเร็จ!");
        resetToBarcodeStep();
      } catch (err) {
        console.error(err);
        errEl.innerText = err.message;
        alert("เกิดข้อผิดพลาด: " + err.message);
      } finally {
        btn.innerText = "💾 บันทึกรูปและจบงาน";
        btn.disabled = false;
      }
    }

    function resetToBarcodeStep() {
      stopCustomerCamera();
      customerImages = [];
      renderPreview();
      currentBillNumber = "";
      document.getElementById("billBadge").innerText = "รอสแกน";
      document.getElementById("manualBillInput").value = "";
      document.getElementById("errorLog").innerText = "";
      document.getElementById("stepCustomer").style.display = "none";
      document.getElementById("stepBarcode").style.display = "block";
      startBarcodeScanner();
    }
  </script>
</body>
</html>
