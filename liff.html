<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสแกนบิลและถ่ายรูป</title>
  
  <!-- ไลบรารี LIFF, Supabase และตัวอ่านบาร์โค้ด ZXing -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="shared/config.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f2f5; padding: 12px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .badge { background: #2e7d32; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 14px; font-weight: bold; }
    
    /* โซนกล้อง */
    .scanner-box { position: relative; width: 100%; max-width: 400px; height: 260px; margin: auto; overflow: hidden; border-radius: 8px; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .laser-guide { position: absolute; top: 50%; left: 10%; width: 80%; height: 2px; background: red; box-shadow: 0 0 4px red; }
    
    /* ปุ่มกด */
    .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin-top: 8px; }
    .btn-green { background: #2e7d32; color: #fff; }
    .btn-blue { background: #1976d2; color: #fff; }
    .btn-orange { background: #f57c00; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #999; color: #333; }
    
    input[type="text"] { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; text-align: center; margin-top: 6px; }
    .preview-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .thumb-box { position: relative; width: 80px; height: 80px; }
    .thumb-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
    .thumb-box button { position: absolute; top: 0; right: 0; background: red; color: #fff; border: none; border-radius: 0 0 0 6px; width: 22px; height: 22px; }
  </style>
</head>
<body>

  <!-- การ์ดหัวข้อ -->
  <div class="card">
    <div class="header-bar">
      <h3 id="stationLabel">กำลังโหลด...</h3>
      <span class="badge" id="billBadge">รอเลขบิล</span>
    </div>

    <!-- สเต็ปที่ 1: กล้องสแกนบาร์โค้ด -->
    <div id="stepBarcode">
      <p style="text-align: center; font-size: 14px; color: #555; margin-bottom: 8px;">เล็งแท่งบาร์โค้ดให้อยู่ตรงกลางเส้นสีแดง</p>
      <div class="scanner-box">
        <video id="barcodeVideo"></video>
        <div class="laser-guide"></div>
      </div>

      <div style="margin-top: 14px; text-align: center;">
        <span style="font-size: 13px; color: #777;">หรือถ้าบาร์โค้ดอ่านไม่ติด ให้พิมพ์เลขที่นี่:</span>
        <input type="text" id="manualBillInput" placeholder="กรอกเลขบิล เช่น 69011-1788852961">
        <button class="btn btn-blue" onclick="useManualBill()">ตกลงใช้เลขนี้</button>
      </div>
    </div>

    <!-- สเต็ปที่ 2: โหมดถ่ายรูปลูกค้า (จะเปิดเมื่อได้เลขบิลแล้ว) -->
    <div id="stepCustomer" style="display: none;">
      <p style="text-align: center; font-size: 14px; color: #2e7d32; font-weight: bold; margin-bottom: 6px;" id="billTitleText"></p>
      
      <div class="scanner-box" style="height: 300px;">
        <video id="customerVideo" autoplay playsinline></video>
      </div>
      
      <button class="btn btn-orange" onclick="takeCustomerPhoto()">📸 กดถ่ายรูปลูกค้า</button>
      
      <div id="photoPreviewList" class="preview-grid"></div>

      <div style="margin-top: 14px;">
        <button id="btnSave" class="btn btn-green" onclick="saveCustomerData()">💾 บันทึกรูปและจบงาน</button>
        <button class="btn btn-outline" onclick="resetToBarcodeStep()">ยกเลิก / สแกนบิลใหม่</button>
      </div>
    </div>
  </div>

  <script>
    const MY_LIFF_ID = "2011506265-xs6XZnCO";
    let db = null;
    let codeReader = null;
    let currentStation = "1";
    let currentBillNumber = "";
    let customerImages = [];
    let customerStream = null;

    // เริ่มต้นระบบเมื่อเปิดหน้าเว็บ
    window.onload = async () => {
      // ดึงสถานีจาก Query Param เช่น ?station=2 ถ้าไม่ระบุให้เป็น 1
      const urlParams = new URLSearchParams(window.location.search);
      currentStation = urlParams.get('station') || '1';
      document.getElementById("stationLabel").innerText = `สถานีที่ ${currentStation}`;

      // เชื่อมต่อ Supabase
      db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // เริ่มต้นระบบ LINE LIFF
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        startBarcodeScanner();
      } catch (err) {
        console.error("LIFF Init Error", err);
        startBarcodeScanner(); // ทำงานต่อแม้เปิดผ่าน Browser ปกติ
      }
    };

    // 1. ฟังก์ชันเปิดกล้องอ่านบาร์โค้ดสด
    function startBarcodeScanner() {
      codeReader = new ZXing.BrowserMultiFormatReader();
      codeReader.decodeFromVideoDevice(null, 'barcodeVideo', (result, err) => {
        if (result) {
          // อ่านบาร์โค้ดติดแล้ว!
          onBillDetected(result.text);
        }
      });
    }

    function useManualBill() {
      const val = document.getElementById("manualBillInput").value.trim();
      if (!val) { alert("กรุณาพิมพ์เลขบิลก่อนครับ"); return; }
      onBillDetected(val);
    }

    // เมื่อได้เลขบิลแล้ว สลับไปโหมดถ่ายรูปลูกค้า
    function onBillDetected(billNo) {
      currentBillNumber = billNo;
      
      // ปิดกล้องอ่านบาร์โค้ด
      if (codeReader) {
        codeReader.reset();
        codeReader = null;
      }

      document.getElementById("stepBarcode").style.display = "none";
      document.getElementById("stepCustomer").style.display = "block";
      document.getElementById("billBadge").innerText = "บิล: " + billNo;
      document.getElementById("billTitleText").innerText = `กำลังบันทึกรูปลูกค้าบิล: ${billNo}`;

      // เปิดกล้องถ่ายรูปลูกค้า
      startCustomerCamera();
    }

    // 2. ฟังก์ชันกล้องถ่ายรูปลูกค้า
    async function startCustomerCamera() {
      const video = document.getElementById("customerVideo");
      try {
        customerStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }, // ใช้กล้องหลัง
          audio: false
        });
        video.srcObject = customerStream;
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องถ่ายภาพได้ กรุณาอนุญาตสิทธิ์กล้อง");
      }
    }

    function stopCustomerCamera() {
      if (customerStream) {
        customerStream.getTracks().forEach(track => track.stop());
        customerStream = null;
      }
    }

    // กดถ่ายรูปและบีบอัดรูปย่อลงอัตโนมัติ
    function takeCustomerPhoto() {
      const video = document.getElementById("customerVideo");
      const canvas = document.createElement("canvas");
      const targetWidth = 640;
      const scale = targetWidth / video.videoWidth;
      canvas.width = targetWidth;
      canvas.height = video.videoHeight * scale;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const smallDataUrl = canvas.toDataURL("image/jpeg", 0.7);
      customerImages.push(smallDataUrl);
      renderPreview();
    }

    function removePhoto(idx) {
      customerImages.splice(idx, 1);
      renderPreview();
    }

    function renderPreview() {
      const box = document.getElementById("photoPreviewList");
      box.innerHTML = "";
      customerImages.forEach((url, idx) => {
        const div = document.createElement("div");
        div.className = "thumb-box";
        div.innerHTML = `<img src="${url}"><button onclick="removePhoto(${idx})">X</button>`;
        box.appendChild(div);
      });
    }

    // 3. บันทึกข้อมูลและรูปภาพเข้า Supabase
    async function saveCustomerData() {
      if (customerImages.length === 0) {
        alert("กรุณาถ่ายรูปลูกค้าอย่างน้อย 1 รูปครับ");
        return;
      }

      const btn = document.getElementById("btnSave");
      btn.innerText = "กำลังบันทึกข้อมูล...";
      btn.disabled = true;

      try {
        const uploadedUrls = [];
        for (let i = 0; i < customerImages.length; i++) {
          const res = await fetch(customerImages[i]);
          const blob = await res.blob();
          const filePath = `${currentBillNumber}/station${currentStation}/${Date.now()}_${i+1}.jpg`;
          
          await db.storage.from(STORAGE_BUCKET).upload(filePath, blob, { contentType: 'image/jpeg', upsert: true });
          const { data: pData } = db.storage.from(STORAGE_BUCKET).getPublicUrl(filePath);
          uploadedUrls.push(pData.publicUrl);
        }

        // อัปเดตตาราง customers
        let { data: existing } = await db.from("customers").select("bill_number").eq("bill_number", currentBillNumber).single();

        const updatePayload = {
          bill_number: currentBillNumber,
          [`station${currentStation}_status`]: "DONE",
          [`station${currentStation}_thumbs`]: uploadedUrls,
          [`station${currentStation}_time`]: new Date().toISOString()
        };

        if (!existing) {
          await db.from("customers").insert([updatePayload]);
        } else {
          await db.from("customers").update(updatePayload).eq("bill_number", currentBillNumber);
        }

        alert("✅ บันทึกข้อมูลบิล " + currentBillNumber + " สำเร็จ!");
        resetToBarcodeStep();
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
      } finally {
        btn.innerText = "💾 บันทึกรูปและจบงาน";
        btn.disabled = false;
      }
    }

    // รีเซ็ตหน้าจอเพื่อเริ่มบิลใหม่
    function resetToBarcodeStep() {
      stopCustomerCamera();
      customerImages = [];
      renderPreview();
      currentBillNumber = "";
      document.getElementById("billBadge").innerText = "รอเลขบิล";
      document.getElementById("manualBillInput").value = "";
      document.getElementById("stepCustomer").style.display = "none";
      document.getElementById("stepBarcode").style.display = "block";
      startBarcodeScanner();
    }
  </script>
</body>
</html>
