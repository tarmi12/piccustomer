<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สถานีสุดท้าย — ยืนยันรับเงิน</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<div class="wrap">
  <span class="station-tag">Final</span>
  <h1>ยืนยันตัวตน + รับเงิน</h1>

  <label for="billInput">เลขที่บิล (สแกนบาร์โค้ดหรือพิมพ์)</label>
  <input type="text" id="billInput" autofocus placeholder="สแกนบาร์โค้ด...">

  <div id="lookupStatus"></div>

  <div id="reviewBox" style="display:none;">
    <div class="section">
      <label>ชื่อลูกค้า</label>
      <div id="customerName" style="font-size:18px; margin-bottom:6px;"></div>
    </div>
    <div class="section">
      <label>รูปทั้งหมดจากทุกสถานี — ตรวจสอบว่าเป็นคนเดียวกัน</label>
      <div id="allRows"></div>
    </div>
    <div class="section">
      <button class="btn-primary" id="paidBtn">รับเงินแล้ว</button>
    </div>
  </div>

  <div id="paidStatus"></div>
</div>

<script src="shared/config.js"></script>
<script src="shared/api.js"></script>
<script>
const billInput = document.getElementById('billInput');
const lookupStatus = document.getElementById('lookupStatus');
const reviewBox = document.getElementById('reviewBox');
const customerNameEl = document.getElementById('customerName');
const allRows = document.getElementById('allRows');
const paidBtn = document.getElementById('paidBtn');
const paidStatus = document.getElementById('paidStatus');

let currentBill = null;

billInput.addEventListener('change', async () => {
  const bill = billInput.value.trim();
  if (!bill) return;
  currentBill = bill;
  reviewBox.style.display = 'none';
  paidStatus.innerHTML = '';
  lookupStatus.innerHTML = statusHtml('info', 'กำลังค้นหา...');
  try {
    const res = await callGas('getCustomer', { billNumber: bill });
    if (!res.found) {
      lookupStatus.innerHTML = statusHtml('error', 'ไม่พบบิลนี้ในระบบ — ยังไม่ได้ถ่ายภาพที่สถานีใดเลย');
      return;
    }
    lookupStatus.innerHTML = '';
    customerNameEl.textContent = res.customerName || '(ไม่มีชื่อบันทึกไว้)';
    renderRows(res.stations);
    if (res.finalStatus === 'รับเงินแล้ว') {
      paidStatus.innerHTML = statusHtml('info', 'บิลนี้รับเงินไปแล้วก่อนหน้านี้');
      paidBtn.disabled = true;
    } else {
      paidBtn.disabled = false;
    }
    reviewBox.style.display = 'block';
  } catch (err) {
    lookupStatus.innerHTML = statusHtml('error', err.message);
  }
});

function renderRows(stations) {
  const labels = { station1: 'Station 1', station2: 'Station 2', station3: 'Station 3' };
  allRows.innerHTML = Object.keys(labels).map(key => {
    const st = stations[key];
    const thumbs = (st && st.thumbs) || [];
    return `<div class="history-row">
      <div class="label">${labels[key]}</div>
      <div class="thumbs">
        ${thumbs.length
          ? thumbs.map(u => `<img src="${u}">`).join('')
          : '<span class="empty">ยังไม่ถ่าย</span>'}
      </div>
    </div>`;
  }).join('');
}

paidBtn.addEventListener('click', async () => {
  if (!currentBill) return;
  paidBtn.disabled = true;
  paidStatus.innerHTML = statusHtml('info', 'กำลังบันทึก...');
  try {
    await callGas('markPaid', { billNumber: currentBill });
    paidStatus.innerHTML = statusHtml('ok', 'บันทึก "รับเงินแล้ว" สำเร็จ');
    setTimeout(() => {
      billInput.value = '';
      reviewBox.style.display = 'none';
      paidStatus.innerHTML = '';
      billInput.focus();
    }, 1200);
  } catch (err) {
    paidStatus.innerHTML = statusHtml('error', err.message);
    paidBtn.disabled = false;
  }
});

function statusHtml(type, msg) {
  return `<div class="status ${type}">${msg}</div>`;
}
</script>
</body>
</html>
